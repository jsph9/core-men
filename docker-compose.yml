version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: coremen-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coremen
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
